appId: ${EXPO_GO_APP_ID_IOS}
tags:
  - smoke
---
# Smoke: top-bar controls (⋯ menu, editor save pill row) are tappable with dev-menu reserve.
- runFlow: subflows/open-expo-project.yaml
- runFlow:
    file: subflows/create-folder.yaml
    env:
      FOLDER_NAME: 英単語
- tapOn:
    id: folder-row-英単語
- tapOn:
    id: folder-menu
- assertVisible:
    id: menu-rename
- tapOn:
    id: dialog-cancel
- tapOn:
    id: folder-try-sample
- extendedWaitUntil:
    visible:
      id: editor-folder
    timeout: 60000
- assertVisible:
    id: editor-save
- tapOn:
    id: editor-folder
- assertVisible:
    id: dialog-cancel
- tapOn:
    id: dialog-cancel
- tapOn:
    id: editor-close
- tapOn:
    id: dialog-confirm
