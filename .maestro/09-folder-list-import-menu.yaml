appId: ${EXPO_GO_APP_ID_IOS}
tags:
  - smoke
---
# Folder list ⋯ menu exposes import action in the a11y tree (testID tap, not text regex).
- runFlow: subflows/open-expo-project.yaml
- runFlow:
    file: subflows/create-folder.yaml
    env:
      FOLDER_NAME: 英単語
- extendedWaitUntil:
    visible:
      id: folder-list-menu
    timeout: 60000
- tapOn:
    id: folder-list-menu
- assertVisible:
    id: folder-list-menu-import
- tapOn:
    id: dialog-cancel
